services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiver_support_agent
    env_file:
      - path: .env
        required: false
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
    volumes:
      - ./reports:/app/reports
    command: ["python", "demo.py", "--preset"]

  interactive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiver_support_agent_interactive
    env_file:
      - path: .env
        required: false
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
    stdin_open: true
    tty: true
    command: ["python", "demo.py"]

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiver_support_agent_benchmark
    env_file:
      - path: .env
        required: false
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
    command: ["python", "evaluation/eval_metrics.py", "--limit", "30"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiver_support_agent_test
    env_file:
      - path: .env
        required: false
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
    command: ["pytest", "tests/test_agent.py", "-v"]

